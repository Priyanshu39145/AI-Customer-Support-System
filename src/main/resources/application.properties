spring.application.name=AI-Customer-Support-Backend-System

# Server
server.port=8080

# CORS - configurable for different environments
app.cors.allowed-origins=http://localhost:5174,http://localhost


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


jwt.secretKey=${JWTSECRET}

spring.security.oauth2.client.registration.google.client-id = ${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret = ${OAUTH_CLIENT_SECRET}

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.cache-names=ticket-details
spring.cache.redis.time-to-live: 5m



spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.num-ctx=2048
spring.ai.ollama.chat.options.num-predict=512
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.chat.options.num-thread=6
spring.ai.ollama.chat.options.num-batch=256





# MariaDB vector store connection
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Ollama embedding model
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Vector store table name
spring.ai.vectorstore.mariadb.table-name=message_embeddings

# Auto-create the vector table on startup
spring.ai.vectorstore.mariadb.initialize-schema=true

# Number of similar results to return
spring.ai.vectorstore.mariadb.default-top-k=10




spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
