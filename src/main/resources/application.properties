spring.application.name=AI-Customer-Support-Backend-System

# Server
server.port=8080

# CORS - configurable for different environments
#app.cors.allowed-origins=http://localhost:5174,http://localhost
#We do this to make overridable by Docker compose ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost}
app.frontend.url=${FRONTEND_URL:http://localhost:5174}

# Browser authentication cookies. Local development is HTTP, so Secure defaults to false.
# Production must set AUTH_COOKIE_SECURE=true and use HTTPS.
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
app.auth.csrf-cookie.domain=${AUTH_CSRF_COOKIE_DOMAIN:${AUTH_COOKIE_DOMAIN:}}


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


jwt.secretKey=${JWTSECRET}
jwt.accessTokenExpirationMinutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
jwt.refreshTokenExpirationDays=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

spring.security.oauth2.client.registration.google.client-id = ${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret = ${OAUTH_CLIENT_SECRET}

spring.cache.type=redis
#This is done to allow redis to run in both localhost or the custom endpoint given in env variables ---
#If our application is dockerized then backend container is the localhost itself so it needs updated endpoint ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cache.cache-names=ticket-details
spring.cache.redis.time-to-live: 5m


#This done allows ollama to run in both localhost or the custom endpoint given in env variables ----
#Docker compose can override ----
#REDIS_HOST=redis
#OLLAMA_BASE_URL=http://ollama:11434
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://ollama:11434}
spring.ai.ollama.chat.options.num-ctx=2048
spring.ai.ollama.chat.options.num-predict=512
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.chat.options.num-thread=6
spring.ai.ollama.chat.options.num-batch=256



# MariaDB vector store connection
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Ollama embedding model
spring.ai.ollama.embedding.options.model=nomic-embed-text

#Given dimensions ----
spring.ai.vectorstore.mariadb.dimensions=768

# Vector store table name
spring.ai.vectorstore.mariadb.table-name=message_embeddings

# Auto-create the vector table on startup
spring.ai.vectorstore.mariadb.initialize-schema=true

# Number of similar results to return
spring.ai.vectorstore.mariadb.default-top-k=10




spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



#logging changes ----
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-}] [%X{spanId:-}] [%X{requestId:-}] %-5level %logger{36} - %msg%n


